name: GA-ERP Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Code Quality & Container Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Validate Backend Dependencies & Compilation
        run: |
          cd backend
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit
          else
            npm install --prefer-offline --no-audit
          fi
          npm run build --if-present

      - name: Validate Frontend Dependencies & Build
        run: |
          cd frontend
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit
          else
            npm install --prefer-offline --no-audit
          fi
          npm run build

      - name: Validate Docker Compose Build
        run: |
          docker compose build backend frontend

  deploy-to-server:
    name: Continuous Deployment to Production Server
    needs: validate-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH Key Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Execute Remote Deployment Pipeline
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          APP_PATH: /opt/nexusedge-erp
        run: |
          PORT="${SERVER_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "${PORT}" -H "${SERVER_HOST}" >> ~/.ssh/known_hosts

          ssh -p "${PORT}" "${SERVER_USER}@${SERVER_HOST}" "bash -se" << 'DEPLOY_SCRIPT'
            set -eo pipefail
            cd /opt/nexusedge-erp

            echo "[+] 1. Synchronizing repository to latest main..."
            git fetch origin main
            git reset --hard origin/main

            echo "[+] 2. Rebuilding application containers..."
            docker compose build --pull backend frontend

            echo "[+] 3. Rolling update of core services..."
            docker compose up -d --remove-orphans backend frontend caddy

            echo "[+] 4. Verifying container health..."
            sleep 5

            DB_HEALTH=$(docker inspect -f '{{.State.Health.Status}}' nexusedge-db 2>/dev/null || echo "unknown")
            if [ "$DB_HEALTH" != "healthy" ]; then
              echo "[!] Database health check failed (State: $DB_HEALTH)"
              exit 1
            fi

            API_HEALTH=$(docker compose exec -T caddy wget -qO- --timeout=5 http://backend:4000/health || true)
            if echo "$API_HEALTH" | grep -q "healthy"; then
              echo "[✓] Backend health verified: $API_HEALTH"
            else
              echo "[!] Backend health probe failed: $API_HEALTH"
              exit 1
            fi

            echo "[✓] Deployment completed successfully."
          DEPLOY_SCRIPT

  verify-edge-ingress:
    name: Verify Ingress & Edge TLS
    needs: deploy-to-server
    runs-on: ubuntu-latest
    steps:
      - name: Probe Public Ingress Health Endpoint
        run: |
          DOMAIN="erp.gautambhuwan.com.np"
          echo "Testing ingress: https://${DOMAIN}/health"
          
          for i in {1..6}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "https://${DOMAIN}/health" || echo "000")
            if [ "$HTTP_CODE" == "200" ]; then
              echo "[✓] Edge ingress operational: HTTP 200 OK"
              exit 0
            fi
            echo "Waiting for edge response... (Attempt $i/6 - Status: $HTTP_CODE)"
            sleep 5
          done
          
          echo "[!] Edge ingress probe timed out."
          exit 1
        continue-on-error: true
