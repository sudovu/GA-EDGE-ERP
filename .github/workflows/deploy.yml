name: GA-ERP Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Code Quality & Container Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Validate Backend Dependencies & Compilation
        run: |
          cd backend
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit
          else
            npm install --prefer-offline --no-audit
          fi
          npm run build --if-present

      - name: Validate Frontend Dependencies & Build
        run: |
          cd frontend
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit
          else
            npm install --prefer-offline --no-audit
          fi
          npm run build

      - name: Validate Docker Compose Build
        run: |
          docker compose build backend frontend

  deploy-to-server:
    name: Continuous Deployment to Production Server
    needs: validate-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH Key Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Execute Remote Deployment Pipeline
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          APP_PATH: /opt/nexusedge-erp
        run: |
          PORT="${SERVER_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "${PORT}" -H "${SERVER_HOST}" >> ~/.ssh/known_hosts

          ssh -p "${PORT}" "${SERVER_USER}@${SERVER_HOST}" "bash -se" << 'DEPLOY_SCRIPT'
            set -eo pipefail
            cd /opt/nexusedge-erp

            echo "[+] 1. Synchronizing repository to latest main..."
            git fetch origin main
            git reset --hard origin/main

            echo "[+] 2. Building production container images..."
            docker compose build --pull backend frontend

            echo "[+] 3. Rolling update of application services..."
            docker compose up -d --remove-orphans backend frontend caddy cloudflared

            echo "[+] 4. Verifying database container health..."
            DB_READY=false
            for i in $(seq 1 15); do
              STATUS=$(docker inspect -f '{{.State.Health.Status}}' nexusedge-db 2>/dev/null || echo "starting")
              if [ "$STATUS" = "healthy" ]; then
                echo "[✓] Database confirmed healthy."
                DB_READY=true
                break
              fi
              echo "Waiting for database healthcheck... ($i/15)"
              sleep 2
            done

            if [ "$DB_READY" != "true" ]; then
              echo "[!] Database healthcheck failed."
              docker logs --tail 25 nexusedge-db
              exit 1
            fi

            echo "[+] 5. Probing Fastify backend health gate via Caddy (Polling up to 45s)..."
            API_HEALTHY=false
            for attempt in $(seq 1 15); do
              # Query local Caddy reverse proxy using host curl with explicit Host header
              HTTP_RESP=$(curl -s -m 3 -H "Host: erp.gautambhuwan.com.np" http://127.0.0.1/health 2>/dev/null || echo "ERR_NO_RESPONSE")
              
              if echo "$HTTP_RESP" | grep -q '"status":"healthy"'; then
                echo "[✓] Backend health gate verified: $HTTP_RESP"
                API_HEALTHY=true
                break
              fi

              # Direct container node fallback without external binary dependencies
              NODE_FALLBACK=$(docker compose exec -T backend node -e '
                const http = require("http");
                http.get("http://127.0.0.1:4000/health", r => {
                  let b = "";
                  r.on("data", c => b += c);
                  r.on("end", () => {
                    if (r.statusCode === 200 && b.includes("healthy")) {
                      process.stdout.write("NODE_OK");
                      process.exit(0);
                    }
                    process.exit(1);
                  });
                }).on("error", () => process.exit(1));
              ' 2>/dev/null || echo "NODE_WAIT")

              if [ "$NODE_FALLBACK" = "NODE_OK" ]; then
                echo "[✓] Backend direct health verified via Node loopback."
                API_HEALTHY=true
                break
              fi

              echo "Backend booting... attempt $attempt/15 (Caddy output: '$HTTP_RESP'). Retrying in 3s..."
              sleep 3
            done

            if [ "$API_HEALTHY" != "true" ]; then
              echo "[!] Backend health probe timed out after 45 seconds."
              echo "=== Process Table ==="
              docker compose ps
              echo "=== Fastify Container Logs ==="
              docker logs --tail 40 nexusedge-api
              exit 1
            fi

            echo "[✓] Deployment completed successfully."
          DEPLOY_SCRIPT

  verify-edge-ingress:
    name: Verify Ingress & Edge TLS
    needs: deploy-to-server
    runs-on: ubuntu-latest
    steps:
      - name: Probe Public Ingress Health Endpoint
        run: |
          DOMAIN="erp.gautambhuwan.com.np"
          echo "Testing public ingress: https://${DOMAIN}/health"
          
          for i in $(seq 1 6); do
            HTTP_CODE=$(curl -s -o /dev/null -w "\%{http_code}" -m 10 "https://${DOMAIN}/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "[✓] Edge ingress operational: HTTP 200 OK"
              exit 0
            fi
            echo "Waiting for edge response... (Attempt $i/6 - Status:$HTTP_CODE)"
            sleep 5
          done
          
          echo "[!] Edge ingress probe timed out."
          exit 1
        continue-on-error: true
