name: GA-ERP Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Code Quality & Container Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Validate Backend Dependencies & Compilation
        run: |
          cd backend
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit
          else
            npm install --prefer-offline --no-audit
          fi
          npm run build --if-present

      - name: Validate Frontend Dependencies & Build
        run: |
          cd frontend
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit
          else
            npm install --prefer-offline --no-audit
          fi
          npm run build

      - name: Validate Docker Compose Build
        run: |
          docker compose build backend frontend

  deploy-to-server:
    name: Continuous Deployment to Production Server
    needs: validate-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH Key Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Execute Remote Deployment Pipeline
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          APP_PATH: /opt/nexusedge-erp
        run: |
          PORT="${SERVER_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "${PORT}" -H "${SERVER_HOST}" >> ~/.ssh/known_hosts

          ssh -p "${PORT}" "${SERVER_USER}@${SERVER_HOST}" "bash -se" << 'DEPLOY_SCRIPT'
            set -eo pipefail
            cd /opt/nexusedge-erp

            echo "[+] 1. Synchronizing repository to latest main..."
            git fetch origin main
            git reset --hard origin/main

            echo "[+] 2. Rebuilding application containers..."
            docker compose build --pull backend frontend

            echo "[+] 3. Rolling update of application services..."
            docker compose up -d --remove-orphans backend frontend caddy cloudflared

            echo "[+] 4. Verifying database container health..."
            DB_READY=false
            for i in {1..15}; do
              STATUS=$(docker inspect -f '{{.State.Health.Status}}' nexusedge-db 2>/dev/null || echo "starting")
              if [ "$STATUS" == "healthy" ]; then
                echo "[✓] Database confirmed healthy."
                DB_READY=true
                break
              fi
              echo "Waiting for PostgreSQL healthcheck... ($i/15)"
              sleep 2
            done

            if [ "$DB_READY" != "true" ]; then
              echo "[!] Database failed to become healthy."
              docker logs --tail 20 nexusedge-db
              exit 1
            fi

            echo "[+] 5. Probing Fastify backend health endpoint (IPv4 loopback)..."
            API_HEALTHY=false
            for attempt in {1..15}; do
              # 1. Try explicit IPv4 loopback probe inside backend container
              PROBE_RESULT=$(docker compose exec -T backend node -e '
                const http = require("http");
                const req = http.get("http://127.0.0.1:4000/health", (res) => {
                  let body = "";
                  res.on("data", c => body += c);
                  res.on("end", () => {
                    if (res.statusCode === 200 && body.includes("healthy")) {
                      process.stdout.write("HEALTHY:" + body);
                      process.exit(0);
                    }
                    process.stderr.write(`HTTP_${res.statusCode}_BODY_${body}`);
                    process.exit(1);
                  });
                });
                req.on("error", (e) => { process.stderr.write("ERR_" + e.code); process.exit(1); });
                req.setTimeout(3000, () => { req.destroy(); process.stderr.write("TIMEOUT"); process.exit(1); });
              ' 2>&1 || true)

              if [[ "$PROBE_RESULT" == HEALTHY:* ]]; then
                echo "[✓] Backend health verified via 127.0.0.1:4000: ${PROBE_RESULT#HEALTHY:}"
                API_HEALTHY=true
                break
              fi

              # 2. Fallback probe: test via host Caddy proxy (:80/health)
              CADDY_HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 3 http://127.0.0.1/health 2>/dev/null || echo "000")
              if [ "$CADDY_HTTP_CODE" == "200" ]; then
                echo "[✓] Backend health verified through Caddy Gateway (:80/health)"
                API_HEALTHY=true
                break
              fi

              echo "Backend probe attempt $attempt/15: status='$PROBE_RESULT', caddy_code='$CADDY_HTTP_CODE'. Retrying in 3s..."
              sleep 3
            done

            if [ "$API_HEALTHY" != "true" ]; then
              echo "[!] Backend health probe failed after 45 seconds."
              echo "=== Docker Compose Process Table ==="
              docker compose ps
              echo "=== Fastify Container Logs (nexusedge-api) ==="
              docker logs --tail 40 nexusedge-api
              echo "=== Caddy Gateway Logs (nexusedge-caddy) ==="
              docker logs --tail 20 nexusedge-caddy
              exit 1
            fi

            echo "[✓] Deployment completed successfully."
          DEPLOY_SCRIPT

  verify-edge-ingress:
    name: Verify Ingress & Edge TLS
    needs: deploy-to-server
    runs-on: ubuntu-latest
    steps:
      - name: Probe Public Ingress Health Endpoint
        run: |
          DOMAIN="erp.gautambhuwan.com.np"
          echo "Testing public ingress: https://${DOMAIN}/health"
          
          for i in {1..6}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "https://${DOMAIN}/health" || echo "000")
            if [ "$HTTP_CODE" == "200" ]; then
              echo "[✓] Edge ingress operational: HTTP 200 OK"
              exit 0
            fi
            echo "Waiting for edge response... (Attempt $i/6 - Status: $HTTP_CODE)"
            sleep 5
          done
          
          echo "[!] Edge ingress probe timed out."
          exit 1
        continue-on-error: true
